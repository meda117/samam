<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9f1d37">
  <title>لوحة تحكم صمّام</title>
  <link rel="stylesheet" href="admin.css?v=12">
  <style>#loginGate[hidden]{display:none!important}#adminMain .field input.switch{appearance:none;width:43px!important;height:23px!important;min-width:43px!important;padding:0!important;border:0!important;flex:0 0 43px!important}@media(max-width:620px){html,body,.admin-shell,.admin-content{max-width:100%;overflow-x:hidden}.sidebar{width:min(230px,76vw);gap:8px;padding:12px 8px;overflow-y:auto;scrollbar-width:none}.sidebar::-webkit-scrollbar{display:none}.admin-brand{gap:5px;padding:0 5px;font-size:.84rem}.admin-brand img{width:48px;height:38px}.sidebar nav{gap:1px}.nav-item{padding:7px 8px;font-size:.77rem;line-height:1.25}.nav-item span{width:20px;font-size:.85rem}.view-store{margin-top:6px;padding:7px;font-size:.72rem}#adminMain{padding:16px 11px 34px}.admin-header{padding:11px 12px;min-height:64px}.admin-header h1{font-size:1.05rem}.page-intro{margin-bottom:14px}.page-intro h2{font-size:1.18rem}.page-intro p{font-size:.78rem}.settings-grid,.field-grid{gap:10px}.panel{padding:13px;border-radius:11px}.panel h3{font-size:.95rem}.field{font-size:.76rem}.field input,.field textarea,.field select{padding:8px;font-size:.83rem}.switch-row{padding:7px 0;font-size:.8rem}.switch-row small{font-size:.7rem}.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-card{padding:11px}.quick-actions{gap:8px}.quick-action{padding:10px;font-size:.8rem}}</style>
  <style>body input.switch{appearance:none!important;display:inline-block!important;width:43px!important;min-width:43px!important;max-width:43px!important;height:23px!important;min-height:23px!important;max-height:23px!important;margin:0!important;padding:0!important;border:0!important;box-sizing:border-box!important;vertical-align:middle!important;flex:0 0 43px!important;justify-self:start!important}</style>
  <script src="firebase-config.js?v=1" defer></script>
  <script src="restaurant-data.js?v=14" defer></script>
  <script src="admin-enhancements.js?v=14" defer></script>
  <script src="admin.js?v=13" defer></script>
</head>
<body>
  <section class="login-gate" id="loginGate" hidden>
    <form id="loginForm" class="login-card">
      <img src="images/logo p.png" alt="مطعم صمّام">
      <h1>دخول لوحة التحكم</h1>
      <p>سجّل الدخول بحساب الأدمن الذي أنشأته في Firebase.</p>
      <label>البريد الإلكتروني<input name="email" type="email" required autocomplete="email"></label>
      <label>كلمة المرور<input name="password" type="password" required autocomplete="current-password"></label>
      <p class="login-message" id="loginMessage"></p>
      <button class="primary" type="submit">دخول</button>
    </form>
  </section>
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <a class="admin-brand" href="index.html"><img src="images/logo p.png" alt="مطعم صمّام"><span>إدارة صمّام</span></a>
      <nav aria-label="أقسام لوحة التحكم">
        <button class="nav-item active" data-page="overview"><span>▦</span> نظرة عامة</button>
        <button class="nav-item" data-page="products"><span>◫</span> الأصناف والأسعار</button>
        <button class="nav-item" data-page="rice"><span>◌</span> أنواع الرز</button>
        <button class="nav-item" data-page="fulfillment"><span>⌁</span> التوصيل والاستلام</button>
        <button class="nav-item" data-page="coupons"><span>٪</span> أكواد الخصم</button>
        <button class="nav-item" data-page="content"><span>✦</span> محتوى الموقع</button>
        <button class="nav-item" data-page="backup"><span>⇅</span> النسخ الاحتياطي</button>
      </nav>
      <a class="view-store" href="index.html" target="_blank" rel="noopener">↗ مشاهدة الموقع</a>
    </aside>
    <section class="admin-content">
      <header class="admin-header"><button class="menu-button" data-action="toggle-menu" aria-label="القائمة">☰</button><div><p id="pageKicker">لوحة التحكم</p><h1 id="pageTitle">نظرة عامة</h1></div><span class="save-status" id="saveStatus">جاهز للحفظ</span></header>
      <main id="adminMain" tabindex="-1"></main>
    </section>
  </div>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <section class="modal" id="editorModal" aria-modal="true" role="dialog" aria-hidden="true"></section>
  <div class="admin-toast" id="adminToast" role="status" aria-live="polite"></div>
</body>
</html>
